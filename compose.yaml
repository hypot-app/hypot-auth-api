# Local development stack. Credentials below are for local use only.
services:
  # One-shot: applies pending migrations and exits. The runtime image is distroless
  # (no npm, no shell), so the TypeORM CLI runs with the image's own node. The app
  # itself never migrates on startup (migrationsRun: false).
  migrate:
    # Reuses the image built for the api service (single build, same tag).
    image: hypot-api:dev
    pull_policy: never
    command: ["node_modules/typeorm/cli.js", "migration:run", "-d", "dist/platform/persistence/data-source.js"]
    environment:
      DATABASE_URL: postgres://hypot:hypot_dev_only@postgres:5432/hypot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: creates a dev-only signing key set in the signing_keys volume on first
  # run and leaves it untouched afterwards. `docker compose down -v` discards it.
  keygen:
    image: hypot-api:dev
    pull_policy: never
    command: ["dist/token-lifecycle/infrastructure/generate-signing-keys.js", "/keys/signing-keys.json"]
    volumes:
      - signing_keys:/keys
    restart: "no"

  api:
    build: .
    image: hypot-api:dev
    # Shutdown waits for an email being sent, which is bounded by the 60 s send deadline.
    stop_grace_period: 70s
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://hypot:hypot_dev_only@postgres:5432/hypot
      AUTH_PUBLIC_BASE_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      MAIL_FROM: no-reply@hypot.local
      AUTH_SIGNING_KEYS_FILE: /keys/signing-keys.json
    volumes:
      - signing_keys:/keys:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      keygen:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hypot
      POSTGRES_PASSWORD: hypot_dev_only
      POSTGRES_DB: hypot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypot -d hypot"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  postgres_data:
  signing_keys:
