# Local development stack. Credentials below are for local use only.
# NOTE: the app does not connect to the database yet; U2 wires DATABASE_URL.
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://hypot:hypot_dev_only@postgres:5432/hypot
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hypot
      POSTGRES_PASSWORD: hypot_dev_only
      POSTGRES_DB: hypot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypot -d hypot"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  postgres_data:
